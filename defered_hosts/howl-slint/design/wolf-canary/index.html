<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Howl · wolf studies</title>
<style>:root{color-scheme:dark;--bg:#111619;--card:#1b2226;--text:#dde5e5;--muted:#99a9ae}body{font:15px system-ui;background:var(--bg);color:var(--text);max-width:1100px;margin:auto;padding:36px}body.light{color-scheme:light;--bg:#eef0eb;--card:#fff;--text:#273b35;--muted:#5b6d66}h1{font-size:28px;margin-bottom:8px}p{color:var(--muted);line-height:1.6}button{font:inherit;background:var(--card);color:var(--text);border:1px solid #74877c;border-radius:8px;padding:8px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:28px}article{background:var(--card);border-radius:16px;padding:22px}h2{font-size:18px}img.hero{width:144px;height:144px;display:block;margin:20px auto}.sizes{display:flex;gap:18px;align-items:end;min-height:72px}.sizes span{text-align:center;font:11px system-ui;color:var(--muted)}.sizes img{display:block;margin:0 auto 8px}.mock{display:flex;gap:9px;align-items:center;margin-top:24px;padding:10px;border:1px solid #3e554a;border-radius:6px}.mock img{width:20px;height:20px}footer{margin-top:30px;color:var(--muted)}</style>
<h1>Howl, a little more alive.</h1><p>Three rough directions, not final artwork. Judge the small marks first: friendly should still read as wolf.</p><button id="theme">Switch background</button><main class="grid"></main><footer>Original SVG studies · named shapes · no dependencies, font icons, canvas or embedded bitmap.</footer>
<script>const concepts=[['companion','01 · Companion','A friendly front-facing wolf. Soft face, cheek ruff and a little grin.'],['lookout','02 · Lookout','A quieter side profile. Longer muzzle and asymmetric silhouette.'],['mooncall','03 · Mooncall','A compact howling silhouette. More emblem, less mascot.']];document.querySelector('main').innerHTML=concepts.map(([id,title,desc])=>`<article><h2>${title}</h2><p>${desc}</p><img class="hero" src="${id}.svg" alt="${title}"><div class="sizes">${[16,20,24,32,48].map(n=>`<span><img src="${id}.svg" width="${n}" height="${n}" alt="">${n}px</span>`).join('')}</div><div class="mock"><img src="${id}.svg" alt="">Howl Sessions</div></article>`).join('');document.querySelector('button').onclick=()=>document.body.classList.toggle('light');</script></html>
