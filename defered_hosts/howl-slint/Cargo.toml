[package]
name = "howl-slint"
version = "0.1.0"
edition = "2024"

[features]
# Linux-only, explicitly enabled at runtime with HOWL_GPU=1.
gpu = ["dep:pollster", "slint/unstable-wgpu-30", "slint/renderer-femtovg-wgpu"]

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = "=1.18.1"

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }

[target.'cfg(target_os = "linux")'.dependencies]
pollster = { version = "=0.4.0", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
lucide-slint = "=1.70.0"
slint-build = "=1.18.1"

# Keep debug information and assertions, but optimize the whole frame path,
# including Slint image conversion/presentation. cc inherits this level too.
[profile.dev]
opt-level = 2

# Exact upstream TLS-destruction fix pending a published compatible release.
# Provenance, verification and removal gate: vendor/wgpu-core/howl-backport/README.md.
[patch.crates-io]
wgpu-core = { path = "vendor/wgpu-core" }

[[example]]
name = "queue_tls"
required-features = ["gpu"]
