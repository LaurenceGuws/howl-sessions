name: howl_sessions
description: Flutter host for Howl Sessions, optionally with local Howl Instances.
publish_to: none
version: 0.1.6-dev+7

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  howl_server_client:
    path: ../../mods/server-client/bindings/dart
  howl_server_client_render:
    path: ../../mods/server-client-render/bindings/dart
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/IosevkaTermNerdFont-Regular.ttf
    - assets/fonts/NotoSans-Regular.ttf
    - LICENSES/redistributed-fonts.txt
